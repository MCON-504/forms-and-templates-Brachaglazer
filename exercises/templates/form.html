{% extends "base.html" %}

{% block content %}
    <h1>Form:</h1>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">
        <label>Name:
            <input name="username" type="text">
        </label>
        <button type="submit">Submit</button>
    </form>

    {% if username %}
    <div class="box">
        Hello {{ username }}!
    </div>
    {% endif %}

{% endblock %}
